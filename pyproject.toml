[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yamazaki"
version = "0.1.0a0"
description = "Evidence-driven read-only AIOps agent for ClickHouse and Apache Doris"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.17,<2",
  "clickhouse-connect==1.7.2",
  "httpx>=0.28,<0.29",
  "pydantic==2.13.5",
  "pymysql==1.2.0",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy==2.0.52",
  "sqlglot==30.17.0",
]

[project.optional-dependencies]
agent = ["pydantic-ai-slim[openai]==2.36.0"]
service = ["fastapi==0.141.1", "uvicorn>=0.38,<0.39"]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff==0.16.5",
  "types-pymysql>=1.1,<2",
]

[project.scripts]
yamazaki = "yamazaki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yamazaki"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires the project-owned Docker test environment"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["yamazaki"]
