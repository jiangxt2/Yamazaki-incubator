name: Documentation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint-cli2.yaml
          globs: |
            **/*.md

      - name: Check required repository files
        shell: bash
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f README.md
          test -f SECURITY.md

      - name: Check machine-local paths
        shell: bash
        run: |
          if git grep -n -I -E '(/Users/|/home/|[A-Za-z]:\\Users\\)' -- . ':(exclude).github/workflows/docs.yml'; then
            echo "Machine-local absolute path found in a tracked file."
            exit 1
          fi
